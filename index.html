<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İstif Ebat Listesi — PDF → Excel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--forest:#1a3c2a;--forest-mid:#2d5a3d;--cream:#f5f0e8;--parchment:#ede8dc;--ink:#1c1c1c;--muted:#6b7c6b;--success:#22703a;--error:#b91c1c;--border:#c8d4c0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.page{width:100%;max-width:720px}
.header{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px}
.logo{width:52px;height:52px;background:var(--forest);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 4px 12px rgba(26,60,42,.3)}
.header h1{font-size:1.45rem;font-weight:700;color:var(--forest);letter-spacing:-.02em;line-height:1.2}
.header p{font-size:.875rem;color:var(--muted);margin-top:3px}
.card{background:white;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.07),0 0 0 1px var(--border);overflow:hidden;margin-bottom:14px}
.upload-zone{padding:52px 32px;text-align:center;cursor:pointer;position:relative;transition:background .2s;border-bottom:1px solid var(--border)}
.upload-zone:hover{background:var(--cream)}
.upload-zone.dragover{background:#e8f4ec;border-bottom-color:#4a8c5e}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.uicon{width:72px;height:72px;background:var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;transition:transform .2s}
.upload-zone:hover .uicon{transform:translateY(-2px)}
.upload-zone h2{font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:6px}
.upload-zone p{font-size:.85rem;color:var(--muted)}
.upload-zone em{font-style:normal;color:#4a8c5e;font-weight:600}
.status-wrap{padding:15px 22px;display:none;align-items:center;gap:12px;min-height:54px}
.status-wrap.visible{display:flex}
.status-text{font-size:.88rem;font-weight:500;flex:1}
.status-wrap.processing{background:#f0f7f3}
.status-wrap.processing .status-text{color:var(--forest)}
.status-wrap.ok{background:#f0f9f3}
.status-wrap.ok .status-text{color:var(--success)}
.status-wrap.err{background:#fff5f5}
.status-wrap.err .status-text{color:var(--error)}
.spinner{width:20px;height:20px;border:2.5px solid #c3dfcb;border-top-color:var(--forest);border-radius:50%;animation:spin .75s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.info-grid{display:none;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.info-grid.visible{display:grid}
.info-cell{background:white;padding:14px 18px}
.info-cell:last-child{background:var(--forest)}
.info-cell:last-child .il{color:#a8c9b4}
.info-cell:last-child .iv{color:white}
.il{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.iv{font-size:1rem;font-weight:700;color:var(--forest)}
.preview-wrap{display:none;overflow-x:auto;max-height:260px;border-top:1px solid var(--border)}
.preview-wrap.visible{display:block}
.ptable{width:100%;border-collapse:collapse;font-size:.77rem}
.ptable thead th{background:var(--forest);color:white;padding:8px 10px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}
.ptable tbody td{padding:5px 10px;border-bottom:1px solid #eef0eb;text-align:right;color:var(--ink)}
.ptable tbody td:first-child{text-align:center;font-weight:700;color:var(--forest);background:#f5faf7}
.ptable tfoot td{padding:8px 10px;font-weight:700;background:var(--parchment);border-top:2px solid #4a8c5e;text-align:right;color:var(--forest)}
.ptable tfoot td:first-child{text-align:center}
.dl-card{display:none}
.dl-card.visible{display:block}
.btn-dl{width:100%;padding:16px 24px;background:var(--forest);color:white;border:none;border-radius:16px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .1s;box-shadow:0 4px 14px rgba(26,60,42,.3)}
.btn-dl:hover{background:var(--forest-mid);transform:translateY(-1px)}
.btn-dl:active{transform:translateY(0)}
.btn-rst{width:100%;margin-top:10px;padding:10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:.85rem;cursor:pointer;transition:background .2s,color .2s}
.btn-rst:hover{background:white;color:var(--ink)}
.footer{text-align:center;margin-top:22px;font-size:.78rem;color:#9aab9a}
@media(max-width:540px){.info-grid{grid-template-columns:repeat(2,1fr)}.upload-zone{padding:36px 20px}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="logo">🌲</div>
    <div>
      <h1>İstif Ebat Listesi</h1>
      <p>PDF dosyasını yükleyin, Excel çıktısını indirin</p>
    </div>
  </div>
  <div class="card" id="mainCard">
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".pdf">
      <div class="uicon">📄</div>
      <h2>PDF dosyasını buraya bırakın</h2>
      <p>veya <em>tıklayarak dosya seçin</em></p>
      <p style="margin-top:8px">İstif Ebat Listesi formatı (.pdf)</p>
    </div>
    <div class="status-wrap" id="sw">
      <span id="si"></span>
      <span class="status-text" id="st"></span>
    </div>
    <div class="info-grid" id="ig">
      <div class="info-cell"><div class="il">İstif No</div><div class="iv" id="ii">—</div></div>
      <div class="info-cell"><div class="il">Boy Sayısı</div><div class="iv" id="ib">—</div></div>
      <div class="info-cell"><div class="il">Çap Grubu</div><div class="iv" id="ic">—</div></div>
      <div class="info-cell"><div class="il">Toplam (dm³)</div><div class="iv" id="im">—</div></div>
    </div>
    <div class="preview-wrap" id="pw">
      <table class="ptable" id="pt"></table>
    </div>
  </div>
  <div class="dl-card" id="dlCard">
    <button class="btn-dl" id="btnDl">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Excel Dosyasını İndir
    </button>
    <button class="btn-rst" id="btnRst">← Yeni dosya yükle</button>
  </div>
  <div class="footer">Ayancık Orman İşletme Müdürlüğü · Ebat Listesi Dönüştürücü</div>
</div>

// ── Diameter → Excel row (rows 9-97) ──
// 15-99: row = 9 + (dia - 15)
// Special: 105→94, 104→95, 115→96, 120→97
const SPECIAL_DIA={105:94,104:95,115:96,120:97};
function diaToRow(d){
  if(d>=15&&d<=99) return 9+(d-15);
  return SPECIAL_DIA[d]||null;
}

// Length columns: C,E,G,I,K,M,O (0-indexed for array, column letters for XML)
const LEN_COLS=['C','E','G','I','K','M','O'];

// ────────────────────────────────────────────────────────
// PDF PARSING
// ────────────────────────────────────────────────────────
async function extractLines(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const items=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent();
    for(const item of tc.items){
      const s=item.str;if(!s||!s.trim()) continue;
      items.push({text:s.trim(),x:Math.round(item.transform[4]),y:Math.round(vp.height-item.transform[5])});
    }
  }
  items.sort((a,b)=>a.y-b.y||a.x-b.x);
  const lines=[];
  if(!items.length) return lines;
  let cur=[items[0]],yc=items[0].y;
  for(let i=1;i<items.length;i++){
    const it=items[i];
    if(Math.abs(it.y-yc)<=4){cur.push(it)}
    else{lines.push(cur.map(x=>x.text).join(' '));cur=[it];yc=it.y}
  }
  if(cur.length) lines.push(cur.map(x=>x.text).join(' '));
  return lines;
}

function parseTR(s){return parseFloat(String(s).replace(',','.'))}

function parseIstif(lines){
  const d={istifNo:'',istifNoNum:0,lengths:[],rows:[],totals:null};
  for(const t of lines){
    const m=t.match(/(\d{4})\s*\/\s*(\d+)/);
    if(m&&!d.istifNo){d.istifNo=`${m[1]}/${m[2]}`;d.istifNoNum=parseInt(m[2])}
  }
  for(const t of lines){
    const ms=[...t.matchAll(/(\d+(?:[,\.]\d+)?)\s*metre/gi)];
    if(ms.length>d.lengths.length) d.lengths=ms.map(m=>parseTR(m[1]));
  }
  if(!d.lengths.length) throw new Error('Boylam değerleri bulunamadı');
  const nL=d.lengths.length;
  const skip=/BOYLAR|ADET|metre|İSTİF|Ürün|Çap|İstif|TOPLAM|Orman|Depo|Latince|Bu İstif|Kayıt|Cinsi|tasdik|imza/i;
  for(let t of lines){
    if(skip.test(t)) continue;
    t=t.replace(/^\d{4}\s*\/\s*\d+\s*/,''); // strip istif-no prefix
    const nums=[...t.matchAll(/(\d+(?:[,\.]\d+)?)/g)].map(m=>parseTR(m[1]));
    if(nums.length<3) continue;
    const dia=nums[0];
    if(!Number.isInteger(dia)||dia<10||dia>130) continue;
    if(nums.length<2*nL+3) continue;
    const counts=[],m3s=[];
    for(let i=0;i<nL;i++){counts.push(Math.round(nums[1+i*2]));m3s.push(nums[2+i*2])}
    const tIdx=1+nL*2;
    const tCount=Math.round(nums[tIdx]||0);
    const tM3=nums[tIdx+1]||0;
    if(tCount>0&&Math.abs(tCount-counts.reduce((a,b)=>a+b,0))>2) continue;
    d.rows.push({dia,counts,m3s,totalCount:tCount,totalM3:tM3});
  }
  for(const t of lines){
    if(!/^TOPLAM\b/.test(t.trim())) continue;
    const nums=[...t.matchAll(/(\d+(?:[,\.]\d+)?)/g)].map(m=>parseTR(m[1]));
    if(nums.length>=2*(nL+1)){
      d.totals={counts:[...Array(nL)].map((_,i)=>Math.round(nums[i*2])),
                m3s:[...Array(nL)].map((_,i)=>nums[i*2+1]),
                totalCount:Math.round(nums[nL*2]),totalM3:nums[nL*2+1]};
    }
  }
  if(!d.rows.length) throw new Error('Tablo satırları okunamadı');
  return d;
}

// ────────────────────────────────────────────────────────
// XML CELL HELPERS  (openpyxl-generated template format)
// Empty cells: <c r="X" s="N" t="n"></c>  (NOT self-closing)
// Value cells: <c r="X" s="N" t="n"><v>VALUE</v></c>
// ────────────────────────────────────────────────────────

function setCellNum(xml, ref, value) {
  const r = ref.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // Case 1: self-closing  <c r="X" .../>
  xml = xml.replace(new RegExp(`(<c r="${r}"[^>]*?)/>`), `$1><v>${value}</v></c>`);
  // Case 2: empty non-self-closing  <c r="X" ...></c>
  xml = xml.replace(new RegExp(`(<c r="${r}"[^>]*?)></c>`), `$1><v>${value}</v></c>`);
  // Case 3: plain value  <c r="X" ...><v>OLD</v></c>
  xml = xml.replace(new RegExp(`(<c r="${r}"[^>]*?)><v>[^<]*</v></c>`), `$1><v>${value}</v></c>`);
  return xml;
}

function clearCellNum(xml, ref) {
  const r = ref.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // <c r="X" ...><v>V</v></c>  →  <c r="X" ...></c>  (keep empty, non-self-closing)
  return xml.replace(new RegExp(`(<c r="${r}"[^>]*?)><v>[^<]*</v></c>`), `$1></c>`);
}

// ────────────────────────────────────────────────────────
// EXCEL GENERATION via JSZip
// ────────────────────────────────────────────────────────
async function generateExcel(data) {
  // 1. Decode template base64 → Uint8Array
  const binStr = atob(TEMPLATE_B64);
  const bytes  = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);

  // 2. Load zip (borders, numFmt and L14 formula already in template)
  const zip = await JSZip.loadAsync(bytes);
  let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');

  // ── A. Update İstif No in D5 ──
  xml = setCellNum(xml, 'D5', data.istifNoNum);

  // ── B. Update length values in row 7 (C7,E7,G7,I7,K7,M7,O7) ──
  for(let i=0;i<LEN_COLS.length;i++){
    const ref=LEN_COLS[i]+'7';
    if(i<data.lengths.length) xml=setCellNum(xml,ref,data.lengths[i]);
    else                       xml=clearCellNum(xml,ref);
  }

  // ── C. Clear all ADET values in rows 9-97 ──
  for(let r=9;r<=97;r++){
    for(const col of LEN_COLS) xml=clearCellNum(xml,col+r);
  }

  // ── D. Fill new ADET values from parsed data ──
  for(const row of data.rows){
    const er=diaToRow(row.dia);
    if(!er) continue;
    for(let i=0;i<data.lengths.length&&i<7;i++){
      if(row.counts[i]>0) xml=setCellNum(xml,LEN_COLS[i]+er,row.counts[i]);
    }
  }

  // 3. Save modified worksheet back
  zip.file('xl/worksheets/sheet1.xml', xml);
  zip.remove('xl/calcChain.xml'); // force Excel to recalculate

  // 4. Generate output buffer
  const outBuffer = await zip.generateAsync({
    type:'uint8array', compression:'DEFLATE', compressionOptions:{level:6}
  });
  return outBuffer;
}

// ────────────────────────────────────────────────────────
// PREVIEW TABLE
// ────────────────────────────────────────────────────────
function renderPreview(data){
  const {lengths,rows,totals}=data;
  let h='<thead><tr><th>Çap (cm)</th>';
  for(const l of lengths) h+=`<th>${l}m Adet</th><th>${l}m dm³</th>`;
  h+='<th>Top.Adet</th><th>Top.dm³</th></tr></thead>';
  let b='<tbody>';
  for(const row of rows){
    b+=`<tr><td>${row.dia}</td>`;
    for(let i=0;i<lengths.length;i++)
      b+=`<td>${row.counts[i]||''}</td><td>${row.m3s[i]?row.m3s[i].toFixed(3):''}</td>`;
    b+=`<td>${row.totalCount}</td><td>${row.totalM3.toFixed(3)}</td></tr>`;
  }
  b+='</tbody>';
  let f='<tfoot><tr><td>TOPLAM</td>';
  if(totals){
    for(let i=0;i<lengths.length;i++)
      f+=`<td>${totals.counts[i]||''}</td><td>${totals.m3s[i]?totals.m3s[i].toFixed(3):''}</td>`;
    f+=`<td>${totals.totalCount}</td><td>${totals.totalM3.toFixed(3)}</td>`;
  }
  f+='</tr></tfoot>';
  document.getElementById('pt').innerHTML=h+b+f;
}

// ────────────────────────────────────────────────────────
// MAIN FLOW
// ────────────────────────────────────────────────────────
async function processPDF(file){
  uploadZone.style.display='none';
  setStatus('processing',`"${file.name}" okunuyor…`);
  try{
    const lines = await extractLines(file);
    setStatus('processing','Veriler ayrıştırılıyor…');
    parsedData = parseIstif(lines);
    setStatus('processing','Excel şablonu güncelleniyor…');
    excelBuffer = await generateExcel(parsedData);

    document.getElementById('ii').textContent=parsedData.istifNo||'—';
    document.getElementById('ib').textContent=parsedData.lengths.length+' adet';
    document.getElementById('ic').textContent=parsedData.rows.length+' çap';
    const tot=parsedData.totals;
    document.getElementById('im').textContent=tot?tot.totalM3.toFixed(0):'—';
    ig.className='info-grid visible';
    renderPreview(parsedData);
    pw.className='preview-wrap visible';
    dlCard.className='dl-card visible';
    const no=(parsedData.istifNo||'istif').replace('/','_');
    btnDl.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> İstif-${no}-ebat.xlsx dosyasını indir`;
    setStatus('ok',`${parsedData.rows.length} çap · ${parsedData.lengths.length} boy`+(tot?` · ${tot.totalCount} adet · ${tot.totalM3} dm³`:'')+' · Excel hazır');
  }catch(err){
    console.error(err);
    uploadZone.style.display='';
    setStatus('err','Hata: '+err.message);
  }
}

function downloadExcel(){
  if(!excelBuffer||!parsedData) return;
  const no=(parsedData.istifNo||'istif').replace('/','_');
  const blob=new Blob([excelBuffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Istif-${no}-EbatListesi.xlsx`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}
</script>
